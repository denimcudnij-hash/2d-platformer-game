<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Platformer Game - Web Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            border: 4px solid white;
            border-radius: 8px;
            background-color: #87CEEB;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .controls {
            color: white;
            font-size: 14px;
            line-height: 1.6;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .controls p {
            margin: 5px 0;
        }

        .loading {
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #gameContainer {
            display: none;
        }

        #loadingContainer {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 2D Platformer Game</h1>

        <div id="loadingContainer">
            <div class="loading">Loading WebAssembly...</div>
        </div>

        <div id="gameContainer">
            <canvas id="gameCanvas" width="800" height="600"></canvas>

            <div class="controls">
                <p><strong>Controls:</strong></p>
                <p>🔼 Jump: W or ⬆️ Arrow</p>
                <p>⬅️ Move Left: A or ⬅️ Arrow</p>
                <p>➡️ Move Right: D or ➡️ Arrow</p>
                <p>🔄 Restart (when dead): R</p>
                <p style="margin-top: 15px; font-size: 12px; opacity: 0.8;">Collect coins 🪙 • Pass checkpoints ✓ • Reach the goal 🚩 • Avoid spikes ⚠️</p>
            </div>
        </div>
    </div>

    <script async src="game.js"></script>
</body>
</html>
